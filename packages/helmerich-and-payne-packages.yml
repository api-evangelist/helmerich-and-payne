summary:
  first_party_sdk_count: 0
  third_party_package_count: 2
  note: >-
    H&P publishes NO client library in any public package registry. The documented integration story
    for the one public API — the MagVAR Survey Validation API — is a raw HTTPS GET with query
    parameters; the provider's own words are "programmatic access by user software", with no SDK
    offered. Because no official SDK exists, this repo emits NO `SDKs` pointer in apis.yml and no
    `Packages` pointer either: the sdk_count check must read a genuine zero here.

