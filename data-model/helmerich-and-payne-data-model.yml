  Six schemas, one root, no identifiers and no persistence. The MagVAR Survey Validation API has no
  resources in the REST sense — nothing is created, addressed by id, or retrieved later. The "data
  model" is the shape of a single calculation result, so there are no belongs_to/has_many relations
  between stored entities, only composition inside one response document.
