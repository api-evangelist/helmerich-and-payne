input_model:
  note: >-
    The request has no body. Nineteen required query parameters carry the whole input: a location
    (latitude, longitude, depthBelowMSL + depthUnits), a wellbore orientation (wellboreInclination,
    wellboreAzimuth), a measured triple (measuredBTotal, measuredDip, measuredGTotal), a reference
