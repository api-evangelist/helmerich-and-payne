    reference_doc: https://tools.magvar.com/doc/MagVAR%20Dynamic%20QC%20web%20calculator.pdf
    reference_doc_status: 200
  - name: MagVAR Recovery Simulator (MVRS)
    url: https://tools.magvar.com/mvrs/#/main
