  detail: A single scalar result object. No collections, no cursors, no page parameters.
filtering_and_expansion:
  supported: false
versioning:
  scheme: none
  detail: >-
    No version segment in the path (`basePath: /`), no version header, no version field in the
    response. The contract itself carries no `info.version`. See lifecycle/.
  spec_version: Swagger 2.0 (OpenAPI 2.0)
request_id_tracing:
  supported: false
  detail: >-
    No X-Request-Id, X-Correlation-Id or trace header is returned. The only server-side identifier
    in the response headers is `x-application-context: application:8075`.
error_envelope:
  shape: custom
  format: not-rfc9457
  detail: >-
    400 returns `{"validationErrors":[{"field":..., "message":..., "value":...}]}` — a field-level
