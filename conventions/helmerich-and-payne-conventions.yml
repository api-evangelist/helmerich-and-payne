units_and_enums:
  note: >-
    The strongest convention this API actually has is explicit unit selection. Every physical
    quantity is paired with a required units enum — depthUnits (METER/KILOMETER/FOOT/FOOT_US/YARD/
    MILE/SE_FT), bTotalUnits (NANOTESLA/MICROTESLA/MILLITESLA/TESLA/GAUSS/GAMMA), gTotalUnits
    (M_PER_SEC_SQ/FT_PER_SEC_SQ/G/MILLI_G/G_98/GAL/MILLI_GAL) — and gravityModel and toolCode are
    closed enums too. There are no implicit units anywhere in the contract, which for a wellbore
    survey calculation is the difference between a correct answer and a dangerous one.
  ranges_documented: true
  ranges_note: >-
    Every numeric parameter documents its valid range in its description (latitude -90 to 90,
    longitude -180 to 360, measuredBTotal 0 to 80000, depthBelowMSL -20000 to 60000, and so on),
    and every parameter carries a worked default value. A caller can construct a valid request
    from the contract alone.
