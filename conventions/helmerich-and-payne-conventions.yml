base_url: https://fac-api.magvar.com
media_types:
  request: none (all input is in the query string)
  response: application/json;charset=UTF-8
  declared_produces: '*/*'
  note: >-
    The contract declares `produces: ["*/*"]` — a Springfox default — while the server actually
    returns application/json. A consumer reading the contract alone cannot tell what it will get.
idempotency:
  coverage: na
  mechanism: none
  detail: >-
    The API exposes exactly one operation and it is a GET. There is no mutating surface, so there
    is nothing to replay-protect. `na` here means "no writes exist", not "replay protection is
    missing" — and no `Idempotency` pointer is emitted in apis.yml.
  safe_to_retry: true
  safe_to_retry_basis: >-
    GET /uncertaintyValues is a pure function of its query parameters; identical parameters returned
    identical results across repeat calls.
reversibility:
  grade: na
  detail: >-
    Read-only API. No operation creates, changes or destroys provider-side state, so there is
    nothing to cancel, refund, void or restore. An agent can call this endpoint with no risk of an
    action it cannot take back.
  write_surfaces: []
dry_run_mode:
  supported: na
  detail: Every call is already a calculation with no side effects; a dry run and a real run are the same call.
pagination:
