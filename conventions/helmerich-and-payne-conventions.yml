scope_note: >-
  These conventions describe the one public H&P API: the MagVAR Survey Validation API. It is a
  single-operation, read-only, parameter-in/answer-out calculation endpoint, so several of the
  dimensions below are genuinely not applicable rather than missing.
auth:
