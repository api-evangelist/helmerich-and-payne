name: Helmerich And Payne
aid: helmerich-and-payne
description: >-
  Helmerich & Payne, Inc. (H&P, NYSE: HP) is a Tulsa-based drilling solutions company that operates
  one of the largest land rig fleets in the United States alongside international and offshore
  operations, and sells rig automation and wellbore-placement technology under the H&P Technologies
  banner — FlexRig, AutoSlide, StallAssist, FlexB2D and Autodriller Pro. Its public API surface is
  narrow but real: through Magnetic Variation Services LLC (MagVAR), the directional-drilling
  survey-correction company H&P acquired in 2018, it publishes the MagVAR Survey Validation API, an
  anonymous, read-only HTTPS endpoint that runs ISCWSA OWSG Rev-2 dynamic quality control on MWD
  survey stations and returns per-field Green/Orange/Red verdicts with inclination and azimuth
  uncertainty. H&P links the API from its own customer-tools page and documents it with a Swagger
  2.0 contract served at the API host.
